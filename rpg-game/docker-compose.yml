version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: habit_rpg_db
    environment:
      POSTGRES_DB: habit_rpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: habit_rpg_app
    environment:
      - STORAGE_MODE=database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=habit_rpg
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: